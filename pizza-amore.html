<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">PizzAmore | GeoLiA.zone</title>
    <meta name="description" content="La migliore pizza, kebab e tacos a Paradiso. Servizio di ordinazione a domicilio e d'asporto disponibile.">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "PizzAmore",
      "description": "La migliore pizza, kebab e tacos a Paradiso. Servizio di ordinazione a domicilio e d'asporto disponibile.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Via Franco Zorzi 27",
        "addressLocality": "Paradiso",
        "addressRegion": "Ticino",
        "postalCode": "6900",
        "addressCountry": "CH"
      },
      "telephone": "+4191458248",
      "servesCuisine": ["Pizza", "Kebab", "Tacos"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Menu",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Pizza" } },
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Kebab" } },
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Tacos" } }
        ]
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "08:00",
          "closes": "23:00"
        }
      ]
    }
    </script>
    
    <style>
        /* ... (il tuo CSS resta invariato) ... */
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; margin: 0; border-radius: 0; position: relative; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; }
        .logo-container { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; overflow: hidden; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <script>
    const idNegozio = "pizza_amore"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxbKZi155BNGtFXQwLVrP9HgqteBwbSBICXI8s6IQJHs5240F3AIKEt9fBxyfQgGiJQ/exec";
    
    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('indirizzo').innerText = data.indirizzo || "N/D";
            document.getElementById('orari').innerText = `${data.apMattina}-${data.chiuMattina} | ${data.apPomeriggio}-${data.chiuSera}`;
            
            // Logica stato (Aperto/Chiuso)
            const now = new Date();
            const time = now.getHours() * 60 + now.getMinutes();
            const toMin = (t) => { if (!t || !t.includes(':')) return -1; const [h, m] = t.split(':'); return h * 60 + m * 1; };
            const isOpen = (time >= toMin(data.apMattina) && time < toMin(data.chiuMattina)) || (time >= toMin(data.apPomeriggio) && time < toMin(data.chiuSera));
            document.getElementById('stato-box').innerHTML = isOpen ? '<span style="color:#28a745">● Aperto</span>' : '<span style="color:#dc3545">● Chiuso</span>';
        });

    // ... (tutte le altre tue funzioni rimangono invariate) ...
</script>
</body>
</html>
