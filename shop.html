<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GeoLiA</title>
    <script id="json-ld-schema" type="application/ld+json"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card { background: white; width: 100%; margin: 0; border-radius: 0; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; background-color: #ddd; }
        .logo-box { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; background-size: cover; background-position: center; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; transition: border 0.3s; }
        .user-input.error { border: 2px solid #dc3545; }
        .hidden { display: none; }
        #popup-voto { position: fixed; top: 20px; left: 10%; width: 80%; background: #28a745; color: white; padding: 15px; border-radius: 10px; z-index: 9999; display: none; text-align: center; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* Stili Slider */
        .slider-wrapper { position: relative; width: 100%; margin: 20px 0; }
        .slider-container { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; scroll-behavior: smooth; -ms-overflow-style: none; scrollbar-width: none; }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-container img { height: 250px; width: auto; object-fit: contain; background: #f9f9f9; border: 1px solid #eee; border-radius: 10px; }
        .nav-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); color: white; border: none; padding: 15px 10px; cursor: pointer; z-index: 5; border-radius: 5px; }
        .prev { left: 5px; } .next { right: 5px; }
        #testo-vetrina { margin: 15px 0 5px 0; color: #333; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>
    <div id="popup-voto">Grazie del voto! ⭐</div>

    <div class="card" id="main-content" style="opacity: 0;">
        <div id="cover" class="cover"></div>
        <div id="logo-box" class="logo-box"></div>
        <div class="content">
            <h1 id="nome">...</h1>
            <p id="descrizione"></p>
            <div class="info-box">
                <p><strong>📍 Indirizzo:</strong> <span id="indirizzo"></span></p>
                <p><strong>🕒 Orari:</strong> <span id="orari"></span></p>
                <p><strong>Stato:</strong> <span id="stato-box"></span></p>
                <p><strong>Recensioni:</strong> <span id="media-stelle">0</span>/5 ⭐ (<span id="totale-voti">0</span> voti)</p>
                <p><strong>Totale punti:</strong> <span id="totale-punti">0</span></p>
                <p id="status-limit" style="margin-top:10px; font-weight: bold;"></p>
            </div>

            <button id="btn-contatta" class="btn" style="background:#007bff" onclick="toggleCart()">Contatta il Negozio</button>
            <button id="btn-premium" class="btn" style="background:#25D366; display:none;" onclick="contattaAdmin()">Passa al piano Premium 👑</button>
            
            <h3 id="testo-vetrina" class="hidden"></h3>
            <div id="vetrina-area" class="slider-wrapper hidden">
                <button class="nav-btn prev" onclick="scrollSlider(-250)">❮</button>
                <div id="slider-vetrina" class="slider-container"></div>
                <button class="nav-btn next" onclick="scrollSlider(250)">❯</button>
            </div>

            <div class="info-box">
                <details id="area-commenti" onclick="if(!window.commentiCaricati) { caricaCommenti(); window.commentiCaricati = true; }">
                    <summary style="cursor:pointer; padding:5px;"><strong>💬 Recensioni Clienti</strong></summary>
                    <div id="lista-commenti" style="margin-top:15px; font-size: 0.9em;"><em>Caricamento...</em></div>
                    <div style="margin-top:20px; border-top: 1px solid #eee; pt: 10px;">
                        <input type="text" id="nome-commento" class="user-input" placeholder="Il tuo nome">
                        <textarea id="testo-commento" class="user-input" placeholder="Scrivi un commento..."></textarea>
                        <button class="btn" style="background:#007bff; padding: 12px;" onclick="inviaCommento()">Pubblica Commento</button>
                    </div>
                </details>
            </div>
            
            <div id="mappa-container" style="margin-top:20px; display:none;">
                <iframe id="iframe-mappa" width="100%" height="250" frameborder="0" style="border-radius:12px;" allowfullscreen="true" loading="lazy"></iframe>
                <button class="btn" style="background:#343a40; margin-top:10px;" onclick="apriNavigazione()">Ottieni Indicazioni 🗺️</button>
            </div>
        </div>
    </div>

    <div id="cart-panel">
        <div id="menu-scelta">
            <h3 style="margin-top:0">Come vuoi contattarci?</h3>
            <button id="btn-wa-menu" class="btn" style="background:#25D366" onclick="registraEApri('wa')">WhatsApp 💬</button>
            <button id="btn-email-menu" class="btn" style="background:#ea4335" onclick="registraEApri('email')">Email 📧</button>
            <button id="btn-tel-menu" class="btn" style="background:#343a40" onclick="azioneDiretta('tel')">Telefono 📞</button>
            <button id="btn-web-menu" class="btn" style="background:#0056b3" onclick="azioneDiretta('web')">Sito Web 🌐</button>
            <button class="btn" style="background:#ffc107; color:black;" onclick="vota(5)">Vota 5 Stelle ⭐</button>
            <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
        </div>
        <div id="modulo-invio" class="hidden">
            <h3 id="titolo-modulo" style="margin-top:0">Invia Richiesta</h3>
            <input type="text" id="nome-utente" class="user-input" placeholder="Il tuo Nome" oninput="this.classList.remove('error')">
            <input type="tel" id="tel-utente" class="user-input" placeholder="Il tuo Telefono" oninput="this.classList.remove('error')">
            <textarea id="msg-utente" class="user-input" placeholder="Scrivi il tuo messaggio..." oninput="this.classList.remove('error')"></textarea>
            <button class="btn" style="background:#25D366" onclick="eseguiInvio()">Invia Ora 🚀</button>
            <button class="btn" style="background:#6c757d" onclick="tornaIndietro()">Indietro</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, addDoc, query, orderBy, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAS5tUlgKnQA7xlEU7lNZd6hifqz6Zskzo", authDomain: "geolia-b5b99.firebaseapp.com", projectId: "geolia-b5b99", storageBucket: "geolia-b5b99.firebasestorage.app", messagingSenderId: "760719863827", appId: "1:760719863827:web:9f0c1419d81208cee20fe6" }));
        const idNegozio = new URLSearchParams(window.location.search).get('id') || "ch-ti-paradiso-pizza-amore-00001";
        
        window.d = {}; window.tipoSelezionato = ''; window.commentiCaricati = false;
        
        // Logica Commenti
        window.inviaCommento = async () => {
            const n = document.getElementById('nome-commento'), t = document.getElementById('testo-commento');
            if(!n.value.trim() || !t.value.trim()) return alert("Compila entrambi i campi!");
            await addDoc(collection(db, "shop", idNegozio, "commenti"), { nome: n.value, testo: t.value, data: new Date().toISOString() });
            n.value = ""; t.value = "";
            caricaCommenti();
        };

        async function caricaCommenti() {
            const lista = document.getElementById('lista-commenti');
            const q = query(collection(db, "shop", idNegozio, "commenti"), orderBy("data", "desc"));
            const snap = await getDocs(q);
            lista.innerHTML = "";
            const ora = new Date();
            snap.forEach(async (d) => {
                const c = d.data();
                if ((ora - new Date(c.data)) / (1000*60*60*24) > 90) await deleteDoc(doc(db, "shop", idNegozio, "commenti", d.id));
                else lista.innerHTML += `<p><strong>${c.nome}</strong>: ${c.testo}</p>`;
            });
        }

        window.scrollSlider = (offset) => { document.getElementById('slider-vetrina').scrollBy({ left: offset, behavior: 'smooth' }); };
        function applicaSchemaDaDatabase(schemaString) { const script = document.getElementById('json-ld-schema'); if (script && schemaString) script.textContent = schemaString; }
        async function controllaReset(dati) { const now = new Date(); if (dati.prossimoReset && now >= new Date(dati.prossimoReset)) { const nuovaData = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000); await updateDoc(doc(db, "shop", idNegozio), { count: 0, prossimoReset: nuovaData.toISOString() }); dati.count = 0; } return dati; }
        function aggiornaStatoUI(dati) { if (dati.limite > 0 && dati.count >= dati.limite) { document.getElementById('btn-contatta').style.display = "none"; document.getElementById('btn-premium').style.display = "block"; } }
        
        async function caricaDati() {
            const docSnap = await getDoc(doc(db, "shop", idNegozio));
            if (docSnap.exists()) {
                let dati = await controllaReset(docSnap.data()); window.d = dati;
                if (dati.testoVetrina) { document.getElementById('testo-vetrina').innerText = dati.testoVetrina; document.getElementById('testo-vetrina').classList.remove('hidden'); }
                if (dati.vetrina) { document.getElementById('slider-vetrina').innerHTML = dati.vetrina.map(url => `<img src="${url}">`).join(''); document.getElementById('vetrina-area').classList.remove('hidden'); }
                applicaSchemaDaDatabase(dati.schema);
                document.getElementById('nome').innerText = dati.nome || "Negozio";
                document.getElementById('descrizione').innerText = dati.descrizione || "";
                document.getElementById('indirizzo').innerText = dati.indirizzo || "";
                document.getElementById('orari').innerText = dati.orari ? dati.orari.replace(',', ' | ') : "";
                document.getElementById('media-stelle').innerText = (dati.votiConteggio > 0 ? (dati.votiSomma / dati.votiConteggio).toFixed(1) : 0);
                document.getElementById('totale-voti').innerText = dati.votiConteggio || 0;
                document.getElementById('totale-punti').innerText = dati.votiSomma || 0;
                if(dati.logo) document.getElementById('logo-box').style.backgroundImage = `url('${dati.logo}')`;
                if(dati.copertina) document.getElementById('cover').style.backgroundImage = `url('${dati.copertina}')`;
                if(dati.mappa) { document.getElementById('mappa-container').style.display = "block"; document.getElementById('iframe-mappa').src = dati.mappa; }
                aggiornaStatoUI(dati);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
            }
        }
        
        window.vota = async (v) => { await updateDoc(doc(db, "shop", idNegozio), { votiSomma: increment(v), votiConteggio: increment(1) }); toggleCart(); const p = document.getElementById('popup-voto'); p.style.display = 'block'; setTimeout(() => p.style.display = 'none', 2000); caricaDati(); };
        window.apriNavigazione = () => window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(window.d.indirizzo)}`, '_blank');
        window.incrementaClick = async () => { await updateDoc(doc(db, "shop", idNegozio), { count: increment(1) }); window.d = (await getDoc(doc(db, "shop", idNegozio))).data(); };
        window.toggleCart = () => { const p = document.getElementById('cart-panel'); if (p.style.display !== 'block') { ['wa','email','tel','web'].forEach(t => document.getElementById('btn-'+t+'-menu').style.display = (window.d[t === 'wa' ? 'whatsapp' : t === 'email' ? 'email' : t === 'tel' ? 'telefono' : 'sitoWeb'] ? 'block' : 'none')); p.style.display = 'block'; } else p.style.display = 'none'; };
        window.registraEApri = (t) => { window.tipoSelezionato = t; document.getElementById('menu-scelta').classList.add('hidden'); document.getElementById('modulo-invio').classList.remove('hidden'); };
        window.azioneDiretta = async (t) => { await incrementaClick(); if (t === 'tel') window.location.href = `tel:${window.d.telefono}`; else if (t === 'web') window.open(window.d.sitoWeb, '_blank'); window.toggleCart(); };
        window.eseguiInvio = async () => { const n = document.getElementById('nome-utente'), t = document.getElementById('tel-utente'), m = document.getElementById('msg-utente'); if(!n.value.trim() || !t.value.trim() || !m.value.trim()) return [n,t,m].forEach(e => !e.value.trim() ? e.classList.add('error') : null); await incrementaClick(); const tk = `Richiesta: ${m.value}\nDa: ${n.value}, Tel: ${t.value}`; if (window.tipoSelezionato === 'wa') window.open(`https://wa.me/${window.d.whatsapp}?text=${encodeURIComponent(tk)}`); else window.location.href = `mailto:${window.d.email}?subject=Richiesta&body=${encodeURIComponent(tk)}`; window.toggleCart(); window.tornaIndietro(); };
        window.tornaIndietro = () => { document.getElementById('menu-scelta').classList.remove('hidden'); document.getElementById('modulo-invio').classList.add('hidden'); };
        window.contattaAdmin = () => window.open(`https://wa.me/41764458866?text=${encodeURIComponent('Piano Premium: ' + idNegozio)}`);
        
        caricaDati();
    </script>
</body>
</html>
