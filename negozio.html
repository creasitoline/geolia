<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA - Negozio</title>
    
    <script type="application/ld+json" id="seo-data">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Caricamento...",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Paradiso",
        "addressCountry": "CH"
      }
    }
    </script>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card { background: white; width: 100%; margin: 0; border-radius: 0; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; background-color: #ddd; }
        .logo-box { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; background-size: cover; background-position: center; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="card" id="main-content" style="opacity: 0;">
        <div id="cover" class="cover"></div>
        <div id="logo-box" class="logo-box"></div>
        <div class="content">
            <h1 id="nome">...</h1>
            <p id="descrizione"></p>
            <div class="info-box">
                <p><strong>📍 Indirizzo:</strong> <span id="indirizzo"></span></p>
                <p><strong>🕒 Orari:</strong> <span id="orari"></span></p>
                <p><strong>Stato:</strong> <span id="stato-box"></span></p>
            </div>
            
            <button id="btn-contatta" class="btn" style="background:#007bff" onclick="toggleCart()">Contatta il Negozio</button>
            
            <div id="mappa-container" style="margin-top:20px; display:none;">
                <iframe id="iframe-mappa" width="100%" height="250" frameborder="0" style="border-radius:12px;" allowfullscreen="true" loading="lazy"></iframe>
                <button class="btn" style="background: linear-gradient(135deg, #007bff, #0056b3); margin-top:10px;" onclick="apriNavigazione()">Ottieni Indicazioni 🗺️</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const db = getFirestore(initializeApp({ apiKey: "AIzaSyAS5tUlgKnQA7xlEU7lNZd6hifqz6Zskzo", authDomain: "geolia-b5b99.firebaseapp.com", projectId: "geolia-b5b99", storageBucket: "geolia-b5b99.firebasestorage.app", messagingSenderId: "760719863827", appId: "1:760719863827:web:9f0c1419d81208cee20fe6" }));
        const idNegozio = new URLSearchParams(window.location.search).get('id') || "pizza-amore";

        async function caricaDati() {
            const docSnap = await getDoc(doc(db, "negozi", idNegozio));
            if (docSnap.exists()) {
                const d = docSnap.data();
                
                // Aggiorna Interfaccia
                document.getElementById('nome').innerText = d.nome || "Negozio";
                document.getElementById('descrizione').innerText = d.descrizione || "";
                document.getElementById('indirizzo').innerText = d.indirizzo || "";
                if(d.logo) document.getElementById('logo-box').style.backgroundImage = `url('${d.logo}')`;
                if(d.copertina) document.getElementById('cover').style.backgroundImage = `url('${d.copertina}')`;
                if(d.mappa) {
                    document.getElementById('mappa-container').style.display = "block";
                    document.getElementById('iframe-mappa').src = d.mappa;
                }

                // Aggiorna JSON-LD per Google (Ottimizzato 100% SEO)
                const seo = document.getElementById('seo-data');
                seo.innerText = JSON.stringify({
                    "@context": "https://schema.org",
                    "@type": "Restaurant",
                    "name": d.nome || "Negozio",
                    "image": d.copertina || "",
                    "priceRange": "€€",
                    "telephone": d.telefono || "",
                    "description": d.descrizione || "",
                    "address": {
                        "@type": "PostalAddress",
                        "streetAddress": d.indirizzo || ""
                    }
                });

                window.d = d; 
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
            }
        }

        // CORREZIONE: Aggiunto il $ per la variabile
        window.apriNavigazione = () => {
            const indirizzo = encodeURIComponent(window.d.indirizzo);
            window.open(`https://www.google.com/maps/search/?api=1&query=${indirizzo}`, '_blank');
        };

        caricaDati();
    </script>
</body>
</html>
