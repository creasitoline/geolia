<div id="cart-panel">
    <div id="menu-scelta">
        <h3 style="margin-top:0">Come vuoi contattarci?</h3>
        <button class="btn" style="background:#25D366" onclick="registraEApri('wa')">WhatsApp 💬</button>
        <button class="btn" style="background:#ea4335" onclick="registraEApri('email')">Email 📧</button>
        <button class="btn" style="background:#343a40" onclick="azioneDiretta('tel')">Telefono 📞</button>
        <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
    </div>
    <div id="modulo-invio" class="hidden">
        <h3 id="titolo-modulo" style="margin-top:0">Invia Richiesta</h3>
        <input type="text" id="nome-utente" class="user-input" placeholder="Il tuo Nome" required>
        <input type="tel" id="tel-utente" class="user-input" placeholder="Il tuo Telefono" required>
        <textarea id="msg-utente" class="user-input" placeholder="Scrivi il tuo messaggio..." required></textarea>
        <button class="btn" style="background:#25D366" onclick="eseguiInvio()">Invia Ora 🚀</button>
        <button class="btn" style="background:#6c757d" onclick="tornaIndietro()">Indietro</button>
    </div>
</div>

<script type="module">
    // ... (Mantieni il resto del codice di inizializzazione sopra) ...

    window.eseguiInvio = () => { 
        const nome = document.getElementById('nome-utente').value;
        const tel = document.getElementById('tel-utente').value;
        const msg = document.getElementById('msg-utente').value;

        // Verifica campi obbligatori
        if (!nome || !tel || !msg) {
            alert("Per favore, compila tutti i campi!");
            return;
        }

        const ticket = `*Richiesta da GeoLiA*\nNome: ${nome}\nTelefono: ${tel}\nMessaggio: ${msg}`;
        
        if (window.tipoSelezionato === 'wa') {
            window.open(`https://wa.me/${window.d.whatsapp || '41764458866'}?text=${encodeURIComponent(ticket)}`);
        } else {
            window.location.href = `mailto:${window.d.email}?subject=Richiesta da ${nome}&body=${encodeURIComponent(ticket)}`;
        }
        
        window.toggleCart(); 
        window.tornaIndietro();
        // Pulisci i campi dopo l'invio
        document.getElementById('nome-utente').value = '';
        document.getElementById('tel-utente').value = '';
        document.getElementById('msg-utente').value = '';
    };
    
    // ... (Mantieni il resto delle funzioni window.toggleCart, ecc.) ...
</script>
