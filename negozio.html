<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GeoLiA</title>
    <meta name="description" id="meta-desc" content="Hub di ricerca locale GeoLiA.zone">
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Restaurant",
      "name": "PizzAmore",
      "image": "https://i.postimg.cc/Bn4GCfX3/Pizza-con-prosciutto-rucola-e-Parmigiano.webp",
      "priceRange": "€€",
      "description": "La migliore pizza, kebab e tacos a Paradiso. Servizio di ordinazione a domicilio e d'asporto disponibile.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Via Franco Zorzi 27",
        "addressLocality": "Paradiso",
        "addressRegion": "Ticino",
        "postalCode": "6900",
        "addressCountry": "CH"
      },
      "telephone": "+4191458248",
      "servesCuisine": ["Pizza", "Kebab", "Tacos"],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Menu",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Pizza" } },
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Kebab" } },
          { "@type": "Offer", "itemOffered": { "@type": "MenuItem", "name": "Tacos" } }
        ]
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "08:00",
          "closes": "23:00"
        }
      ]
    }
    </script>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        /* Loader stile */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .card { background: white; width: 100%; margin: 0; border-radius: 0; position: relative; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; }
        .logo-container { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; overflow: hidden; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

<div class="card" id="main-content" style="opacity: 0;">
    <div id="cover" class="cover"></div>
    <div class="logo-container"><img id="logo" src="" alt="Logo"></div>
    <div class="content">
        <h1 id="nome">...</h1>
        <p id="descrizione"></p>
        <div class="info-box">
            <p><strong>📍 Indirizzo:</strong> <span id="indirizzo">...</span></p>
            <p><strong>🕒 Orari:</strong> <span id="orari">...</span></p>
            <p><strong>Stato:</strong> <span id="stato-box">...</span></p>
        </div>
        <button id="btn-contatta" class="btn" style="background:#007bff" onclick="toggleCart()">Contatta il Negozio</button>
        <p id="status-limit" style="font-size:13px; text-align:center;"></p>
        <button id="btn-premium" class="btn" style="background:#25D366; display:none;" onclick="contattaAdmin()">Passa al piano Premium 👑</button>
    </div>
</div>

<div id="cart-panel">
    <div id="menu-scelta">
        <h3 style="margin-top:0">Come vuoi contattarci?</h3>
        <button class="btn" style="background:#25D366" onclick="registraEApri('wa')">WhatsApp 💬</button>
        <button class="btn" style="background:#ea4335" onclick="registraEApri('email')">Email 📧</button>
        <button class="btn" style="background:#343a40" onclick="azioneDiretta('tel')">Telefono 📞</button>
        <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
    </div>
    <div id="modulo-invio" class="hidden">
        <h3 id="titolo-modulo" style="margin-top:0">Invia Richiesta</h3>
        <input type="text" id="nome-utente" class="user-input" placeholder="Il tuo Nome">
        <input type="tel" id="tel-utente" class="user-input" placeholder="Il tuo Telefono">
        <textarea id="msg-utente" class="user-input" placeholder="Scrivi il tuo messaggio..."></textarea>
        <button class="btn" style="background:#25D366" onclick="eseguiInvio()">Invia Ora 🚀</button>
        <button class="btn" style="background:#6c757d" onclick="tornaIndietro()">Indietro</button>
    </div>
</div>

<script>
    const idNegozio = "pizza-amore"; 
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPndDKkmPmSCglXTnRJaOcdGKYXOQMsxhm6a8XzI6mFrBTM8EKq92AGKuY-tFjdM_R/exec";
    let negozioData = {}, tipoSelezionato = '';

    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            negozioData = data;
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('page-title').innerText = `${data.nome} | GeoLiA.zone`;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('indirizzo').innerText = data.indirizzo || "N/D";
            document.getElementById('orari').innerText = `${data.apMattina}-${data.chiuMattina} | ${data.apPomeriggio}-${data.chiuSera}`;
            
            if (data.limite > 0 && data.count >= data.limite) {
                document.getElementById('btn-contatta').style.display = "none";
                document.getElementById('btn-premium').style.display = "block";
                document.getElementById('status-limit').innerHTML = "<b>Limite contatti raggiunto.</b>";
            } else {
                document.getElementById('status-limit').innerText = `Accessi: ${data.count || 0} / ${data.limite || 0}`;
            }

            const now = new Date();
            const time = now.getHours() * 60 + now.getMinutes();
            const toMin = (t) => { if (!t || !t.includes(':')) return -1; const [h, m] = t.split(':'); return h * 60 + m * 1; };
            const isOpen = (time >= toMin(data.apMattina) && time < toMin(data.chiuMattina)) || (time >= toMin(data.apPomeriggio) && time < toMin(data.chiuSera));
            document.getElementById('stato-box').innerHTML = isOpen ? '<span style="color:#28a745">● Aperto</span>' : '<span style="color:#dc3545">● Chiuso</span>';
            
            // Rimuovi loader e mostra contenuto
            document.getElementById('loader').style.display = 'none';
            document.getElementById('main-content').style.opacity = '1';
        });

    function toggleCart() { const p = document.getElementById('cart-panel'); p.style.display = (p.style.display === 'block') ? 'none' : 'block'; }
    function registraEApri(tipo) { tipoSelezionato = tipo; document.getElementById('menu-scelta').classList.add('hidden'); document.getElementById('modulo-invio').classList.remove('hidden'); document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia su WhatsApp' : 'Invia Email'; }
    function azioneDiretta(tipo) { fetch(`${SCRIPT_URL}?id=${idNegozio}&action=click`); window.location.href = `tel:${negozioData.telefono || '41764458866'}`; toggleCart(); }
    function contattaAdmin() { window.open(`https://wa.me/41764458866?text=${encodeURIComponent('Vorrei passare al piano Premium per: ' + idNegozio)}`); }
    function eseguiInvio() { fetch(`${SCRIPT_URL}?id=${idNegozio}&action=click`); const nome = document.getElementById('nome-utente').value; const msg = document.getElementById('msg-utente').value; const ticket = `*RICHIESTA DA GEOLIA*\nNome: ${nome}\nMessaggio: ${msg}`; if (tipoSelezionato === 'wa') window.open(`https://wa.me/${negozioData.whatsapp || '41764458866'}?text=${encodeURIComponent(ticket)}`); else window.location.href = `mailto:${negozioData.email}?subject=Richiesta da ${nome}&body=${encodeURIComponent(ticket)}`; toggleCart(); tornaIndietro(); }
    function tornaIndietro() { document.getElementById('menu-scelta').classList.remove('hidden'); document.getElementById('modulo-invio').classList.add('hidden'); }
</script>
</body>
</html>
