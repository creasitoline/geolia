<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GeoLiA</title>
    <script type="application/ld+json" id="json-ld"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card { background: white; width: 100%; margin: 0; border-radius: 0; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; }
        .logo-container { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; overflow: hidden; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loader"><div class="spinner"></div></div>

    <div class="card" id="main-content" style="opacity: 0;">
        <div id="cover" class="cover"></div>
        <div class="logo-container"><img id="logo" src="" alt="Logo"></div>
        <div class="content">
            <h1 id="nome">...</h1>
            <p id="descrizione"></p>
            <div class="info-box">
                <p><strong>📍 Indirizzo:</strong> <span id="indirizzo"></span></p>
                <p><strong>🕒 Orari:</strong> <span id="orari"></span></p>
                <p><strong>Stato:</strong> <span id="stato-box"></span></p>
            </div>
            <button class="btn" style="background:#007bff">Contatta il Negozio</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAS5tUlgKnQA7xlEU7lNZd6hifqz6Zskzo",
            authDomain: "geolia-b5b99.firebaseapp.com",
            projectId: "geolia-b5b99",
            storageBucket: "geolia-b5b99.firebasestorage.app",
            messagingSenderId: "760719863827",
            appId: "1:760719863827:web:9f0c1419d81208cee20fe6"
        };

        const db = getFirestore(initializeApp(firebaseConfig));
        const idNegozio = new URLSearchParams(window.location.search).get('id') || "pizza-amore";

        async function caricaDati() {
            const docSnap = await getDoc(doc(db, "negozi", idNegozio));
            if (docSnap.exists()) {
                const d = docSnap.data();
                document.getElementById('nome').innerText = d.nome;
                document.getElementById('descrizione').innerText = d.descrizione;
                document.getElementById('indirizzo').innerText = d.indirizzo;
                document.getElementById('logo').src = d.logo;
                document.getElementById('cover').style.backgroundImage = `url('${d.copertina}')`;
                document.getElementById('orari').innerText = d.orari;
                
                // Logica Aperto/Chiuso
                const [ap, chi] = d.orari.split('-').map(t => parseInt(t.replace(':', '')));
                const now = new Date().getHours() * 100 + new Date().getMinutes();
                const isOpen = now >= ap && now < chi;
                document.getElementById('stato-box').innerHTML = isOpen ? 
                    '<span style="color:#28a745">● Aperto</span>' : '<span style="color:#dc3545">● Chiuso</span>';

                // INSERIMENTO SCHEMA PULITO
                document.getElementById('json-ld').innerHTML = d.schema;
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('main-content').style.opacity = '1';
            }
        }
        caricaDati();
    </script>
</body>
</html>
