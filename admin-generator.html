<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GeoLiA Admin</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f4f4f4; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; }
        textarea { width: 100%; height: 120px; margin: 10px 0; }
        #output { height: 250px; background: #333; color: #0f0; font-family: monospace; }
    </style>
</head>
<body>

    <script>
        var pass = prompt("Password:");
        if (pass !== "1970") { document.body.innerHTML = "Accesso Negato"; window.stop(); }
    </script>

    <div class="box">
        <h1>Generatore Negozi</h1>
        <label>ID Negozio:</label><br>
        <input type="text" id="idNegozio" placeholder="es: pizza_amore" style="width:100%; padding:8px;"><br><br>
        <label>JSON-LD:</label>
        <textarea id="jsonLd"></textarea>
        <button onclick="genera()" style="padding:10px 20px; cursor:pointer;">GENERA CODICE</button>
        <h3>Risultato:</h3>
        <textarea id="output" readonly></textarea>
    </div>

    <textarea id="template" style="display:none;">
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA</title>
    {{JSON_LD}}
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; padding: 20px; box-sizing: border-box; }
        #loader { position: fixed; top:0; left:0; width:100%; height:100%; background:white; display:flex; justify-content:center; align-items:center; }
    </style>
</head>
<body>
    <div id="loader">Caricamento in corso...</div>
    <div class="card" id="main" style="display:none;">
        <h1 id="nome">...</h1>
        <button onclick="window.location.reload()">Ricarica</button>
    </div>
    <script>
        fetch("https://script.google.com/macros/s/AKfycbyPndDKkmPmSCglXTnRJaOcdGKYXOQMsxhm6a8XzI6mFrBTM8EKq92AGKuY-tFjdM_R/exec?id={{ID_NEGOZIO}}")
        .then(r => r.json()).then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('loader').style.display = 'none';
            document.getElementById('main').style.display = 'block';
        });
    </script>
</body>
</html>
    </textarea>

    <script>
        function genera() {
            var temp = document.getElementById('template').value;
            var id = document.getElementById('idNegozio').value;
            var json = document.getElementById('jsonLd').value;
            var res = temp.replace('{{ID_NEGOZIO}}', id).replace('{{JSON_LD}}', json);
            document.getElementById('output').value = res;
        }
    </script>
</body>
</html>
