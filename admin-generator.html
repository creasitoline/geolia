<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GeoLiA Admin Generator PRO</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #e9ecef; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 150px; margin: 10px 0; font-family: monospace; border: 1px solid #ccc; }
        #output { height: 300px; background: #212529; color: #00ff00; }
        .label { font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-box" class="box">
        <h2>Area Riservata</h2>
        <input type="password" id="pass-input" placeholder="Password">
        <button onclick="checkPass()">Accedi</button>
    </div>

    <div id="app-content" class="box" style="display:none;">
        <h1>Generatore Negozi</h1>
        
        <div class="label">1. Incolla qui il codice HTML base (il tuo "master"):</div>
        <textarea id="htmlBase" placeholder="Incolla qui tutto il codice di pizza-amore.html..."></textarea>

        <div class="label">2. ID Negozio:</div>
        <input type="text" id="idNegozio" placeholder="es: arte_pizza" style="width:100%; padding:8px;">

        <div class="label">3. Codice JSON-LD (senza tag script):</div>
        <textarea id="jsonLd" placeholder='{"@context": ...}'></textarea>

        <button onclick="genera()" style="padding:15px; background:green; color:white; border:none; width:100%; cursor:pointer; font-size:18px;">GENERA CODICE COMPLETO</button>

        <h3>Risultato (Copia questo per il nuovo file):</h3>
        <textarea id="output" readonly></textarea>
    </div>

    <script>
        function checkPass() {
            if (document.getElementById('pass-input').value === "1970") {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
            } else { alert("Password errata"); }
        }

        function genera() {
            var html = document.getElementById('htmlBase').value;
            var id = document.getElementById('idNegozio').value;
            var json = document.getElementById('jsonLd').value;

            // 1. Sostituisce l'ID nel fetch
            // Cerchiamo la stringa specifica del fetch nel tuo codice
            var codiceConId = html.replace(/id=[^"']+/g, "id=" + id);

            // 2. Inserisce il JSON-LD dopo il <head>
            var jsonTag = '<script type="application/ld+json">\n' + json + '\n<\/script>';
            var codiceFinale = codiceConId.replace('<head>', '<head>\n' + jsonTag);

            document.getElementById('output').value = codiceFinale;
        }
    </script>
</body>
</html>
