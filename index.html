<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; margin: 0; padding-bottom: 20px; }
        .cover { width: 100%; height: 250px; background-size: cover; background-position: center; }
        .logo-container { margin: -50px 0 0 20px; width: 100px; height: 100px; border: 4px solid white; border-radius: 15px; overflow: hidden; background: white; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; border: 1px solid #eee; margin-top: 10px; }
        .btn { display: block; color: white; padding: 15px; text-align: center; border-radius: 10px; border: none; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <div class="logo-container"><img id="logo" src="" alt="Logo"></div>
    <div class="content">
        <h1 id="nome">Caricamento...</h1>
        <p id="descrizione"></p>
        <div class="info-box">
            <p><strong>📍 Indirizzo:</strong> <span id="indirizzo">-</span></p>
            <p><strong>🕒 Orari:</strong> <span id="orari">-</span></p>
        </div>
        <button class="btn" style="background:#007bff" onclick="window.location.reload()">Ricarica Pagina</button>
    </div>
</div>

<script>
    const idNegozio = new URLSearchParams(window.location.search).get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxwp3nvTDwWDrmdM0laOUL6_4yA9gMf82_OPpKK-iqSdYHD269zdGk1x9t5ldgrsUKm/exec";

    fetch(SCRIPT_URL + "?id=" + idNegozio)
        .then(response => response.json())
        .then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('cover').style.backgroundImage = "url('" + data.copertina + "')";
            document.getElementById('logo').src = data.logo;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            document.getElementById('orari').innerText = data.apMattina + "-" + data.chiuMattina + " / " + data.apPomeriggio + "-" + data.chiuSera;
        })
        .catch(err => {
            document.getElementById('nome').innerText = "Errore di caricamento";
            console.error(err);
        });
</script>
</body>
</html>
