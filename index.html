<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; margin: 0; }
        .cover { width: 100%; height: 300px; background-size: cover; background-position: center; }
        @media (min-width: 768px) { .cover { height: 60vh; } }
        
        .content { padding: 20px; }
        .info-box { margin-bottom: 15px; }
        .logo-img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
        .categoria { color: #666; font-size: 14px; text-transform: uppercase; }
        .stato-orario { font-weight: bold; padding: 5px 10px; border-radius: 5px; display: inline-block; font-size: 14px; }
        
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        
        #cart-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: white; border-radius: 20px 20px 0 0; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15); 
            z-index: 1000; padding: 25px; box-sizing: border-box; display: none; 
        }
        @media (min-width: 768px) {
            #cart-panel { width: 500px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; }
        }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <div class="content">
        <img id="logo" class="logo-img" src="" style="display:none;">
        <div id="categoria" class="categoria"></div>
        <h1 id="nome" style="margin: 5px 0;">Caricamento...</h1>
        <div id="indirizzo" class="info-box"></div>
        <div id="stato-orario" class="stato-orario"></div>
        <p id="descrizione"></p>
        <button class="btn" style="background:#007bff; margin-top:20px;" onclick="toggleCart()">Contatta il Negozio</button>
    </div>
</div>

<div id="cart-panel">
    <div id="menu-scelta">
        <h3 style="margin-top:0">Come vuoi contattarci?</h3>
        <button class="btn" style="background:#25D366" onclick="apriModulo('wa')">WhatsApp 💬</button>
        <button class="btn" style="background:#ea4335" onclick="apriModulo('email')">Email 📧</button>
        <button class="btn" style="background:#343a40" onclick="azioneDiretta('tel')">Telefono 📞</button>
        <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
    </div>

    <div id="modulo-invio" class="hidden">
        <h3 id="titolo-modulo" style="margin-top:0">Invia Richiesta</h3>
        <input type="text" id="nome-utente" class="user-input" placeholder="Il tuo Nome">
        <input type="tel" id="tel-utente" class="user-input" placeholder="Il tuo Telefono">
        <textarea id="msg-utente" class="user-input" placeholder="Scrivi il tuo messaggio..."></textarea>
        <button class="btn" style="background:#25D366" onclick="eseguiInvio()">Invia Ora 🚀</button>
        <button class="btn" style="background:#6c757d" onclick="tornaIndietro()">Indietro</button>
    </div>
</div>

<script>
    const idNegozio = new URLSearchParams(window.location.search).get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAUnuCQcCOjSqtbBzwotfEaCBY-SaMFbiYZ9vzhAqq9YI9dwcETK1-vW1HP7D_Zsx8/exec";
    let negozioData = {};
    let tipoSelezionato = '';

    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            negozioData = data;
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            
            // Popolamento Nuovi Dati
            if(data.logo) {
                const logo = document.getElementById('logo');
                logo.src = data.logo;
                logo.style.display = 'block';
            }
            document.getElementById('categoria').innerText = data.categoria;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            
            const statoOrario = document.getElementById('stato-orario');
            statoOrario.innerText = data.stato;
            statoOrario.style.backgroundColor = (data.stato === 'Aperto') ? '#d4edda' : '#f8d7da';
            statoOrario.style.color = (data.stato === 'Aperto') ? '#155724' : '#721c24';
        });

    function toggleCart() {
        const panel = document.getElementById('cart-panel');
        panel.style.display = (panel.style.display === 'block') ? 'none' : 'block';
    }

    function apriModulo(tipo) {
        tipoSelezionato = tipo;
        document.getElementById('menu-scelta').classList.add('hidden');
        document.getElementById('modulo-invio').classList.remove('hidden');
        document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia su WhatsApp' : 'Invia Email';
    }

    function tornaIndietro() {
        document.getElementById('menu-scelta').classList.remove('hidden');
        document.getElementById('modulo-invio').classList.add('hidden');
    }

    function azioneDiretta(tipo) {
        if(tipo === 'tel') window.location.href = `tel:${negozioData.telefono || '41764458866'}`;
        toggleCart();
    }

    function eseguiInvio() {
        const nome = document.getElementById('nome-utente').value;
        const tel = document.getElementById('tel-utente').value;
        const msg = document.getElementById('msg-utente').value;
        const ticket = `*RICHIESTA DA GEOLIA*\nNome: ${nome}\nTel: ${tel}\nMessaggio: ${msg}`;
        const numeroWa = (negozioData.whatsapp && negozioData.whatsapp.trim() !== "") ? negozioData.whatsapp : "41764458866";
        
        if (tipoSelezionato === 'wa') {
            window.open(`https://wa.me/${numeroWa}?text=${encodeURIComponent(ticket)}`);
        } else {
            window.location.href = `mailto:${negozioData.email || ''}?subject=Richiesta da ${nome}&body=${encodeURIComponent(ticket)}`;
        }
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: idNegozio, action: 'click'}) });
        toggleCart();
        tornaIndietro();
    }
</script>
</body>
</html>
