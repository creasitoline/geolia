<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negozio</title>
    <!-- Qui verrà iniettato il JSON-LD dal database -->
    <script id="jsonld-container" type="application/ld+json"></script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        .card { background: white; max-width: 400px; margin: 20px auto; border-radius: 15px; overflow: hidden; }
        .cover { height: 150px; background-size: cover; background-position: center; }
        .logo { width: 80px; height: 80px; border-radius: 50%; border: 4px solid white; margin: -40px 0 0 20px; }
        .content { padding: 20px; }
        .btn { display: block; background: #007bff; color: white; padding: 15px; text-align: center; text-decoration: none; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <img id="logo" class="logo" src="">
    <div class="content">
        <h1 id="nome">Caricamento...</h1>
        <p id="descrizione"></p>
        <p><strong>Categoria:</strong> <span id="categoria"></span></p>
        <p><strong>Indirizzo:</strong> <span id="indirizzo"></span></p>
        <div id="orari"></div>
        <a id="btn-mappa" class="btn" href="#">Apri su Mappe</a>
        <div id="btn-contatta" class="btn" onclick="showPopup()">Contatta Ora</div>
    </div>
</div>

<script>
    // Recupera l'ID dall'URL (es: geolia.zone/?id=sg001)
    const urlParams = new URLSearchParams(window.location.search);
    const idNegozio = urlParams.get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAUnuCQcCOjSqtbBzwotfEaCBY-SaMFbiYZ9vzhAqq9YI9dwcETK1-vW1HP7D_Zsx8/exec";

    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('categoria').innerText = data.categoria;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            document.getElementById('btn-mappa').href = data.linkMappa;
            document.getElementById('jsonld-container').textContent = data.jsonLd;
        });
</script>
</body>
</html>
