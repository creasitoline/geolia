<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negozio</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f4f4; }
        .card { background: white; max-width: 400px; margin: 20px auto; border-radius: 15px; overflow: hidden; }
        .cover { height: 150px; background-size: cover; background-position: center; }
        .btn { display: block; background: #007bff; color: white; padding: 15px; text-align: center; margin: 10px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <div style="padding:20px">
        <h1 id="nome">Caricamento...</h1>
        <button class="btn" onclick="document.getElementById('popup').style.display='block'">Contatta Ora</button>
    </div>
</div>

<div id="popup" style="display:none; position:fixed; bottom:0; width:100%; background:white; padding:20px; box-shadow:0 -5px 10px rgba(0,0,0,0.1);">
    <button class="btn" style="background:#25D366" onclick="invia('wa')">WhatsApp</button>
    <button class="btn" style="background:#007bff" onclick="invia('email')">Email</button>
    <button class="btn" style="background:#ccc" onclick="document.getElementById('popup').style.display='none'">Chiudi</button>
</div>

<script>
    const idNegozio = new URLSearchParams(window.location.search).get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAUnuCQcCOjSqtbBzwotfEaCBY-SaMFbiYZ9vzhAqq9YI9dwcETK1-vW1HP7D_Zsx8/exec";
    let dataNegozio = {};

    fetch(SCRIPT_URL + "?id=" + idNegozio)
        .then(r => r.json())
        .then(data => {
            dataNegozio = data;
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('cover').style.backgroundImage = "url('" + data.copertina + "')";
        });

    function invia(tipo) {
        if (parseInt(dataNegozio.click) >= parseInt(dataNegozio.limite)) {
            alert("Limite raggiunto. Contatta il 41764458866");
            return;
        }
        
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: idNegozio, action: 'click'}) });

        if (tipo === 'wa') window.open("https://wa.me/" + dataNegozio.whatsapp);
        else window.location.href = "mailto:" + dataNegozio.email;
    }
</script>
</body>
</html>
