<div id="cart-panel">
    <div id="menu-scelta">
        <h3 style="margin-top:0">Contatta</h3>
        <button class="btn" style="background:#25D366" onclick="preparaInvio('wa')">WhatsApp 💬</button>
        <button class="btn" style="background:#ea4335" onclick="preparaInvio('email')">Email 📧</button>
        <button class="btn" style="background:#343a40" onclick="invia('tel')">Chiama Ora 📞</button>
        <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
    </div>

    <div id="modulo-input" style="display:none;">
        <h3 id="titolo-modulo" style="margin-top:0">Scrivi messaggio</h3>
        <input type="text" id="nome-utente" class="user-input" placeholder="Il tuo Nome">
        <input type="tel" id="tel-utente" class="user-input" placeholder="Il tuo Telefono">
        <textarea id="msg-utente" class="user-input" placeholder="Scrivi il tuo messaggio..."></textarea>
        
        <button class="btn" style="background:#28a745" onclick="invia('conferma')">Invia Ora 🚀</button>
        <button class="btn" style="background:#6c757d" onclick="tornaAlMenu()">Indietro</button>
    </div>
</div>

<script>
    let tipoScelto = '';

    function preparaInvio(tipo) {
        tipoScelto = tipo;
        document.getElementById('menu-scelta').style.display = 'none';
        document.getElementById('modulo-input').style.display = 'block';
        document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia su WhatsApp' : 'Invia Email';
    }

    function tornaAlMenu() {
        document.getElementById('menu-scelta').style.display = 'block';
        document.getElementById('modulo-input').style.display = 'none';
    }

    function invia(tipo) {
        // Se è 'tel', invia direttamente
        if (tipo === 'tel') {
            window.location.href = `tel:${negozioData.telefono || '41764458866'}`;
            return;
        }

        // Se è 'conferma', usa i dati del modulo
        const nome = document.getElementById('nome-utente').value;
        const tel = document.getElementById('tel-utente').value;
        const msg = document.getElementById('msg-utente').value;
        const ticket = `*NUOVA RICHIESTA*\nNome: ${nome}\nTel: ${tel}\nMessaggio: ${msg}`;
        
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({id: idNegozio, action: 'click'}) });

        if (tipoScelto === 'wa') {
            window.open(`https://wa.me/${negozioData.whatsapp || '41764458866'}?text=${encodeURIComponent(ticket)}`);
        } else if (tipoScelto === 'email') {
            window.location.href = `mailto:${negozioData.email}?subject=Contatto da ${nome}&body=${encodeURIComponent(ticket)}`;
        }
        
        toggleCart();
        tornaAlMenu();
    }
</script>
