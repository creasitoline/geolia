<div id="popup" style="display:none; position:fixed; bottom:0; left:0; width:100%; max-width:400px; margin: 0 auto; right:0; background:white; padding:20px; border-radius:20px 20px 0 0; box-shadow:0 -5px 15px rgba(0,0,0,0.2); box-sizing:border-box; z-index:1000;">
    
    <div id="menu-scelta">
        <h3 style="margin-top:0; text-align:center;">Contatta il Negozio</h3>
        <button class="btn" style="background:#25D366" onclick="mostraModulo('wa')">💬 Invia WhatsApp</button>
        <button class="btn" style="background:#007bff" onclick="mostraModulo('email')">📧 Invia Email</button>
        <button class="btn" style="background:#6c757d" onclick="closePopup()">Annulla</button>
    </div>

    <div id="modulo-contatto" style="display:none;">
        <h3 id="titolo-modulo" style="text-align:center;"></h3>
        <input type="text" id="input-nome" placeholder="Il tuo Nome" style="width:100%; padding:12px; margin:5px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">
        <input type="tel" id="input-telefono" placeholder="Il tuo Telefono" style="width:100%; padding:12px; margin:5px 0; border:1px solid #ccc; border-radius:5px; box-sizing:border-box;">
        <textarea id="input-messaggio" placeholder="Scrivi il tuo messaggio..." style="width:100%; padding:12px; margin:5px 0; border:1px solid #ccc; border-radius:5px; height:80px; box-sizing:border-box;"></textarea>
        
        <button class="btn" style="background:#28a745" onclick="eseguiInvio()">Invia Messaggio</button>
        <button class="btn" style="background:#dc3545" onclick="indietro()">Indietro</button>
    </div>
</div>

<script>
    let tipoScelto = '';

    function mostraModulo(tipo) {
        tipoScelto = tipo;
        document.getElementById('menu-scelta').style.display = 'none';
        document.getElementById('modulo-contatto').style.display = 'block';
        document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia su WhatsApp' : 'Invia Email';
    }

    function indietro() {
        document.getElementById('menu-scelta').style.display = 'block';
        document.getElementById('modulo-contatto').style.display = 'none';
    }

    function eseguiInvio() {
        // Verifica limite click
        if (parseInt(negozioData.click) >= parseInt(negozioData.limite)) {
            alert("Limite raggiunto. Contatta il 41764458866 per il piano Premium.");
            return;
        }

        const nome = document.getElementById('input-nome').value;
        const tel = document.getElementById('input-telefono').value;
        const msg = document.getElementById('input-messaggio').value;

        // Incremento contatore lato server
        fetch(SCRIPT_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ id: idNegozio, action: 'click' }) 
        });

        // Apertura App
        if (tipoScelto === 'wa') {
            const url = `https://wa.me/${negozioData.whatsapp}?text=Ciao, sono ${nome}. Tel: ${tel}. Messaggio: ${msg}`;
            window.open(url, '_blank');
        } else {
            const url = `mailto:${negozioData.email}?subject=Messaggio da ${nome}&body=${msg}%0A%0AContatto: ${tel}`;
            window.location.href = url;
        }
        closePopup();
        indietro(); // Reset per la prossima volta
    }
</script>
