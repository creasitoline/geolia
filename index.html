<div id="popup" style="display:none; position:fixed; bottom:0; left:0; width:100%; background:white; padding:20px; border-radius:20px 20px 0 0; box-shadow:0 -5px 15px rgba(0,0,0,0.2); box-sizing:border-box; z-index:1000;">
    
    <div id="menu-scelta">
        <h3 style="margin-top:0; text-align:center;">Contatta il Negozio</h3>
        <button class="btn" onclick="apriModulo('wa')">💬 Invia WhatsApp</button>
        <button class="btn" onclick="apriModulo('email')">📧 Invia Email</button>
        <button class="btn" style="background:#555" onclick="closePopup()">Annulla</button>
    </div>

    <div id="modulo-contatto" style="display:none;">
        <h3 id="titolo-modulo" style="text-align:center;"></h3>
        <input type="text" id="nome" placeholder="Il tuo Nome" style="width:100%; padding:10px; margin:5px 0; box-sizing:border-box;">
        <input type="text" id="telefono" placeholder="Il tuo Telefono" style="width:100%; padding:10px; margin:5px 0; box-sizing:border-box;">
        <textarea id="messaggio" placeholder="Scrivi il tuo messaggio..." style="width:100%; padding:10px; margin:5px 0; height:80px; box-sizing:border-box;"></textarea>
        <button class="btn" style="background:#28a745" onclick="inviaMessaggio()">Invia Ora</button>
        <button class="btn" style="background:#dc3545" onclick="resetModulo()">Indietro</button>
    </div>
</div>

<script>
    let tipoAttivo = '';

    function apriModulo(tipo) {
        tipoAttivo = tipo;
        document.getElementById('menu-scelta').style.display = 'none';
        document.getElementById('modulo-contatto').style.display = 'block';
        document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia WhatsApp' : 'Invia Email';
    }

    function resetModulo() {
        document.getElementById('menu-scelta').style.display = 'block';
        document.getElementById('modulo-contatto').style.display = 'none';
    }

    function inviaMessaggio() {
        // Verifica limite click
        if (parseInt(negozioData.click) >= parseInt(negozioData.limite)) {
            alert("Limite raggiunto. Contatta il 41764458866");
            return;
        }

        const nome = document.getElementById('nome').value;
        const msg = document.getElementById('messaggio').value;
        const tel = document.getElementById('telefono').value;

        // Logica invio
        if (tipoAttivo === 'wa') {
            const waLink = `https://wa.me/${negozioData.whatsapp}?text=Ciao, sono ${nome}. Tel: ${tel}. Messaggio: ${msg}`;
            window.open(waLink, '_blank');
        } else {
            window.location.href = `mailto:${negozioData.email}?subject=Messaggio da ${nome}&body=${msg}%0A%0AContatto: ${tel}`;
        }

        // Incremento contatore (chiamata POST)
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ id: idNegozio, action: 'click' }) });
        closePopup();
    }
</script>
