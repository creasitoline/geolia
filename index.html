<script>
    const urlParams = new URLSearchParams(window.location.search);
    const idNegozio = urlParams.get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxAUnuCQcCOjSqtbBzwotfEaCBY-SaMFbiYZ9vzhAqq9YI9dwcETK1-vW1HP7D_Zsx8/exec";
    let negozioData = null; // Inizializzato a null

    // Caricamento dati con gestione errori
    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(res => res.json())
        .then(data => {
            negozioData = data;
            document.getElementById('nome').innerText = data.nome || "Negozio";
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('categoria').innerText = data.categoria;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            document.getElementById('btn-mappa').href = data.linkMappa;
            document.getElementById('jsonld-container').textContent = data.jsonLd;
        })
        .catch(err => {
            console.error("Errore caricamento:", err);
            document.getElementById('nome').innerText = "Errore caricamento dati";
        });

    function showPopup() { document.getElementById('popup').style.display = 'block'; }
    function closePopup() { document.getElementById('popup').style.display = 'none'; }

    function apriModulo(tipo) {
        if (!negozioData) return alert("Dati non ancora caricati, attendi...");
        tipoAttivo = tipo;
        document.getElementById('menu-scelta').style.display = 'none';
        document.getElementById('modulo-contatto').style.display = 'block';
        document.getElementById('titolo-modulo').innerText = (tipo === 'wa') ? 'Invia WhatsApp' : 'Invia Email';
    }

    function resetModulo() {
        document.getElementById('menu-scelta').style.display = 'block';
        document.getElementById('modulo-contatto').style.display = 'none';
    }

    function inviaMessaggio() {
        if (!negozioData) return;
        
        if (parseInt(negozioData.click) >= parseInt(negozioData.limite)) {
            alert("Limite raggiunto. Contatta il 41764458866");
            return;
        }

        const nome = document.getElementById('nome').value;
        const msg = document.getElementById('messaggio').value;
        const tel = document.getElementById('telefono').value;

        // Invio POST per incremento
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ id: idNegozio, action: 'click' }) });

        if (tipoAttivo === 'wa') {
            window.open(`https://wa.me/${negozioData.whatsapp}?text=Ciao, sono ${nome}. Tel: ${tel}. Messaggio: ${msg}`);
        } else {
            window.location.href = `mailto:${negozioData.email}?subject=Messaggio da ${nome}&body=${msg}%0A%0AContatto: ${tel}`;
        }
        closePopup();
    }
</script>
