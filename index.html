<script>
    const idNegozio = new URLSearchParams(window.location.search).get('id');
    // USA L'URL DELLA TUA WEB APP AGGIORNATA
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbywnKXnws0b7VGw6D-HNRzNov9wQUt4EAO0xAZUlVlqt4apAE8ojHYhPn5nOxnKwzWe/exec";
    
    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            console.log(data); // Ti aiuta a vedere i dati in F12 -> Console
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('cover').style.backgroundImage = "url('" + data.copertina + "')";
            document.getElementById('logo').src = data.logo;
            
            // Indirizzo
            document.getElementById('indirizzo').innerText = data.indirizzo;
            
            // Orario: ho unito apertura e chiusura come nel tuo JSON
            document.getElementById('orario').innerText = `${data.giorni} | ${data.apertura} - ${data.chiusura}`;
            
            // Stato: visto che nel JSON hai "18:30", se vuoi il colore, 
            // confrontiamo il valore. Se vuoi mantenere il colore verde/rosso:
            const statoSpan = document.getElementById('stato-testo');
            statoSpan.innerText = data.stato; // Qui stamperà 18:30
            
            // Se vuoi logica per il colore, adattala in base a cosa scrivi nel foglio
            statoSpan.className = 'stato-aperto'; 
        })
        .catch(err => {
            console.error("Errore caricamento:", err);
            document.getElementById('nome').innerText = "Errore di caricamento dati";
        });
</script>
