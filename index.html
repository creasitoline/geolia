<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; margin: 0; position: relative; }
        .cover { width: 100%; height: 300px; background-size: cover; background-position: center; }
        @media (min-width: 768px) { .cover { height: 400px; } }
        
        /* Logo stile Facebook */
        .logo-container { position: absolute; bottom: -50px; left: 20px; border: 4px solid white; border-radius: 15px; overflow: hidden; width: 120px; height: 120px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .logo-img { width: 100%; height: 100%; object-fit: cover; }
        
        .content { padding: 60px 20px 20px 20px; } /* Padding alto per lasciare spazio al logo */
        .info-box { margin-top: 10px; color: #555; }
        .stato-orario { font-weight: bold; margin-bottom: 5px; }
        .orari-txt { font-size: 14px; color: #888; }
        
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        @media (min-width: 768px) { #cart-panel { width: 500px; left: 50%; transform: translateX(-50%); border-radius: 20px 20px 0 0; } }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <div class="logo-container">
        <img id="logo" class="logo-img" src="" onerror="this.style.display='none'">
    </div>
    <div class="content">
        <div id="categoria" style="color:#007bff; font-size:14px; text-transform:uppercase;"></div>
        <h1 id="nome" style="margin: 10px 0;">Caricamento...</h1>
        <div id="indirizzo" class="info-box"></div>
        
        <div style="margin-top:15px;">
            <div id="stato-orario"></div>
            <div id="orari-completi" class="orari-txt"></div>
        </div>

        <p id="descrizione" style="margin-top:20px;"></p>
        <button class="btn" style="background:#007bff; margin-top:20px;" onclick="toggleCart()">Contatta il Negozio</button>
    </div>
</div>

<script>
    // ... (Logica SCRIPT_URL e ID uguale) ...
    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('categoria').innerText = data.categoria;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            
            // Logica Orari: G2=Giorni, H2=Apertura, I2=Chiusura, J2=Stato
            const stato = document.getElementById('stato-orario');
            stato.innerHTML = (data.stato === 'Aperto') 
                ? '<span style="color:green">● Aperto</span>' 
                : '<span style="color:red">● Chiuso</span>';
            
            document.getElementById('orari-completi').innerText = `${data.giorni}: ${data.apertura} - ${data.chiusura}`;
        });
    // ... (Funzioni toggleCart, apriModulo, eseguiInvio identiche) ...
</script>
</body>
</html>
