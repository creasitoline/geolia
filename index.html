<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoLiA</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        
        .card { background: white; width: 100%; margin: 0; position: relative; }
        /* Forza l'altezza della copertina e il caricamento dello sfondo */
        .cover { width: 100%; height: 50vh; background-size: cover; background-position: center; background-repeat: no-repeat; background-color: #ccc; }
        
        .logo-container {
            position: relative;
            margin-top: -60px;
            margin-left: 20px;
            width: 120px;
            height: 120px;
            border: 4px solid white;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .content { padding: 20px; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; cursor: pointer; }
        
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; padding: 25px; box-sizing: border-box; display: none; }
        .user-input { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    
    <div class="logo-container">
        <img id="logo" src="" style="display:block;">
    </div>
    
    <div class="content">
        <h1 id="nome">Caricamento...</h1>
        <p id="descrizione"></p>
        <button class="btn" style="background:#007bff" onclick="toggleCart()">Contatta il Negozio</button>
    </div>
</div>

<script>
    const idNegozio = new URLSearchParams(window.location.search).get('id');
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwv1T_nUxlNZ3JIT0ifbP9gpWsLY4vG_tRZBGM6efwgb_CdpnrGaGErF0_1SD4RXK0C/exec";

    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            console.log("Dati caricati:", data);
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            
            // Applica la copertina direttamente come stile background
            document.getElementById('cover').style.backgroundImage = "url('" + data.copertina + "')";
            
            // Applica il logo
            document.getElementById('logo').src = data.logo;
        })
        .catch(err => console.error("Errore fetch:", err));

    // ... (funzioni toggleCart, eseguiInvio, ecc. rimangono uguali)
</script>
</body>
</html>
