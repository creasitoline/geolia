<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GeoLiA Home</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .filter-btn { margin: 5px; padding: 10px; cursor: pointer; }
        .neg-link { display: block; padding: 15px; border-bottom: 1px solid #eee; text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <h1>Negozi GeoLiA</h1>
    <div id="filtri"></div>
    <div id="lista-negozi"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcn7w4nx3q7Ccu9VCQmQKDofGkI1KGmibiAa3IHiXWXnczAXRr8MHx2yEy7VIznsjP/exec";

        fetch(SCRIPT_URL)
            .then(r => r.json())
            .then(data => {
                // Crea i filtri
                let cats = [...new Set(data.map(n => n.cat))];
                document.getElementById('filtri').innerHTML = cats.map(c => 
                    `<button class="filter-btn" onclick="filtra('${c}')">${c}</button>`).join('');
                render(data);
            });

        function render(data) {
            document.getElementById('lista-negozi').innerHTML = data.map(n => 
                `<a class="neg-link" href="${n.id}.html">${n.nome}</a>`).join('');
        }

        function filtra(cat) {
            fetch(SCRIPT_URL).then(r => r.json()).then(data => {
                let filtrati = data.filter(n => n.cat === cat);
                render(filtrati);
            });
        }
    </script>
</body>
</html>
