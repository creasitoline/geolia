<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GeoLiA - Home</title>
    <link rel="icon" href="tuo-logo.png">
    <style>
        body { font-family: sans-serif; margin: 0; padding-bottom: 80px; }
        .header { padding: 20px; text-align: center; }
        .search-box { width: 90%; padding: 15px; margin: 10px; border-radius: 20px; border: 1px solid #ccc; }
        .filters { display: flex; overflow-x: auto; padding: 10px; gap: 10px; }
        .link-list { padding: 20px; }
        .nav-bottom { position: fixed; bottom: 0; width: 100%; height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
    </style>
</head>
<body>

    <div class="header">
        <img src="tuo-logo.png" width="100">
        <input type="text" id="search" class="search-box" placeholder="Cerca negozio..." onkeyup="filtra()">
    </div>

    <div class="filters">
        <button onclick="filtraCategoria('tutti')">Tutti</button>
        <button onclick="filtraCategoria('pizza')">Pizza</button>
        <button onclick="filtraCategoria('gelato')">Gelato</button>
    </div>

    <div class="link-list" id="lista">
        <div class="item" data-cat="pizza"><a href="pizza-amore.html">PizzAmore</a></div>
        <div class="item" data-cat="gelato"><a href="gelateria-top.html">Gelateria Top</a></div>
    </div>

    <div class="nav-bottom">
        <span>⬅️ Indietro</span>
        <span>🏠 Home</span>
    </div>

    <script>
        function filtra() {
            let input = document.getElementById('search').value.toLowerCase();
            let items = document.getElementsByClassName('item');
            for (let i of items) {
                i.style.display = i.innerText.toLowerCase().includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
