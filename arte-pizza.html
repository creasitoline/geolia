<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GeoLiA</title>
    <meta name="description" id="meta-desc" content="Hub di ricerca locale GeoLiA.zone">
    <!-- Questo sarà riempito dallo script per la SEO -->
    <script id="jsonld-placeholder" type="application/ld+json"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        .card { background: white; width: 100%; margin: 0; border-radius: 0; box-shadow: none; position: relative; }
        .cover { width: 100%; height: 35vh; background-size: cover; background-position: center; }
        .logo-container { position: relative; margin-top: -60px; margin-left: 20px; width: 120px; height: 120px; border: 4px solid white; border-radius: 15px; overflow: hidden; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { padding: 20px; }
        .info-box { background: #fff; padding: 15px; border-radius: 10px; margin: 15px 0; border: 1px solid #eee; }
        .btn { display: block; color: white; padding: 18px; text-align: center; border-radius: 12px; cursor: pointer; border: none; width: 100%; font-size: 18px; margin-bottom: 10px; font-weight: bold; }
        #cart-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 20px 20px 0 0; padding: 25px; box-sizing: border-box; display: none; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 1000; }
    </style>
</head>
<body>

<div class="card">
    <div id="cover" class="cover"></div>
    <div class="logo-container"><img id="logo" src="" alt="Logo"></div>
    <div class="content">
        <h1 id="nome">Caricamento...</h1>
        <p id="descrizione"></p>
        <div class="info-box">
            <p><strong>📍 Indirizzo:</strong> <span id="indirizzo">...</span></p>
            <p><strong>🕒 Orari:</strong> <span id="orari">...</span></p>
            <p><strong>Stato:</strong> <span id="stato-box">Verifica...</span></p>
        </div>
        <button id="btn-contatta" class="btn" style="background:#007bff" onclick="toggleCart()">Contatta il Negozio</button>
        <p id="status-limit" style="text-align:center; font-size: 13px;"></p>
        <button id="btn-premium" class="btn" style="background:#25D366; display:none;" onclick="contattaAdmin()">Passa al piano Premium 👑</button>
    </div>
</div>

<div id="cart-panel">
    <div id="menu-scelta">
        <h3 style="margin-top:0">Come vuoi contattarci?</h3>
        <button class="btn" style="background:#25D366" onclick="registraEApri('wa')">WhatsApp 💬</button>
        <button class="btn" style="background:#ea4335" onclick="registraEApri('email')">Email 📧</button>
        <button class="btn" style="background:#343a40" onclick="azioneDiretta('tel')">Telefono 📞</button>
        <button class="btn" style="background:#6c757d" onclick="toggleCart()">Chiudi</button>
    </div>
    <div id="modulo-invio" style="display:none;">
        <h3 id="titolo-modulo" style="margin-top:0">Invia Richiesta</h3>
        <input type="text" id="nome-utente" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="Il tuo Nome">
        <textarea id="msg-utente" style="width:100%; padding:10px; margin-bottom:10px;" placeholder="Messaggio..."></textarea>
        <button class="btn" style="background:#25D366" onclick="eseguiInvio()">Invia Ora 🚀</button>
        <button class="btn" style="background:#6c757d" onclick="tornaIndietro()">Indietro</button>
    </div>
</div>

<script>
    // --- MODIFICA SOLO QUESTA RIGA PER OGNI NUOVO FILE ---
    const idNegozio = "NOME_ID_NEGOZIO"; 
    // -----------------------------------------------------
    
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZmUbNFE-oeeZgJvX43M3PtnCiB4jMUYlN2xTO4KjgZlHk4yeXP-SKDiYF2xfSjNK-/exec";
    
    fetch(`${SCRIPT_URL}?id=${idNegozio}`)
        .then(r => r.json())
        .then(data => {
            document.getElementById('nome').innerText = data.nome;
            document.getElementById('descrizione').innerText = data.descrizione;
            document.getElementById('page-title').innerText = `${data.nome} | GeoLiA.zone`;
            document.getElementById('cover').style.backgroundImage = `url('${data.copertina}')`;
            document.getElementById('logo').src = data.logo;
            document.getElementById('indirizzo').innerText = data.indirizzo;
            document.getElementById('orari').innerText = `Mattina: ${data.apMattina}-${data.chiuMattina} | Pom: ${data.apPomeriggio}-${data.chiuSera}`;
            
            // Inserimento dinamico JSON-LD
            if (data.jsonLd) document.getElementById('jsonld-placeholder').textContent = data.jsonLd;

            if (data.limite > 0 && data.count >= data.limite) {
                document.getElementById('btn-contatta').style.display = "none";
                document.getElementById('status-limit').innerHTML = "<b>Limite contatti raggiunto.</b>";
                document.getElementById('btn-premium').style.display = "block";
            } else {
                document.getElementById('status-limit').innerText = `Accessi: ${data.count || 0} / ${data.limite || 0}`;
            }
        });

    function toggleCart() {
        const p = document.getElementById('cart-panel');
        p.style.display = (p.style.display === 'block') ? 'none' : 'block';
    }
    
    // Aggiungi qui le altre funzioni registraEApri, azioneDiretta, ecc.
</script>
</body>
</html>
